<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আমবাগান অ্যাডমিন ড্যাশবোর্ড</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Hind Siliguri"', 'system-ui', 'sans-serif'] } } } };
try {
  var t = localStorage.getItem('theme');
  if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
} catch (e) {}
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: #f8fafc; }
  html.dark body { background: #0f172a; }
</style>
</head>
<body class="font-sans text-slate-800 dark:text-slate-100">

<div id="overlay" class="fixed inset-0 z-30 bg-black/40 hidden lg:hidden"></div>

<aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full lg:translate-x-0 transition-transform bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-5 flex flex-col">
  <div class="flex items-center gap-2 mb-8 mt-2">
    <span class="text-2xl">🥭</span>
    <span class="text-lg font-bold">আমবাগান</span>
  </div>
  <nav id="menu" class="space-y-1 text-[15px]"></nav>
  <div class="mt-auto text-xs text-slate-400">চাঁপাইনবাবগঞ্জ · রাজশাহী থেকে সরাসরি</div>
</aside>

<div class="lg:pl-64">
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 sm:px-6 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800" style="padding-top:env(safe-area-inset-top,0px)">
    <button id="burger" class="lg:hidden text-2xl" aria-label="মেনু">☰</button>
    <div class="relative flex-1 max-w-md">
      <input type="search" placeholder="অর্ডার বা কাস্টমার খুঁজুন…" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-amber-500">
    </div>
    <button id="theme" class="rounded-lg border border-slate-200 dark:border-slate-700 px-2.5 py-1.5 text-sm" aria-label="ডার্ক মোড">🌙</button>
    <button class="relative text-xl" aria-label="নোটিফিকেশন">🔔<span class="absolute -top-1 -right-1 h-4 w-4 rounded-full bg-red-500 text-[10px] text-white grid place-items-center">৩</span></button>
    <div class="flex items-center gap-2">
      <div class="h-9 w-9 rounded-full bg-amber-500 text-white grid place-items-center font-semibold">র</div>
      <div class="hidden sm:block leading-tight"><div class="text-sm font-semibold">রাশেদ আহমেদ</div><div class="text-xs text-slate-500 dark:text-slate-400">মালিক</div></div>
    </div>
  </header>

  <main class="p-4 sm:p-6 space-y-6">
    <div>
      <h1 class="text-2xl font-bold">ড্যাশবোর্ড</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">শুক্রবার, ২৭ নভেম্বর — আজকের ব্যবসার সারসংক্ষেপ</p>
    </div>

    <section id="stats" class="grid grid-cols-2 xl:grid-cols-4 gap-4"></section>

    <section class="grid xl:grid-cols-3 gap-6">
      <div class="xl:col-span-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
        <div class="flex justify-between items-baseline mb-4">
          <h2 class="font-semibold">সপ্তাহের বিক্রি</h2>
          <span class="text-sm text-slate-500 dark:text-slate-400">মোট ৳৩,২১,৫০০</span>
        </div>
        <div id="chart" class="overflow-x-auto"></div>
      </div>
      <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
        <h2 class="font-semibold mb-4">স্টক (কেজি)</h2>
        <ul id="stock" class="space-y-4"></ul>
      </div>
    </section>

    <section class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
      <h2 class="font-semibold mb-4">সাম্প্রতিক অর্ডার</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[640px]">
          <thead class="text-left text-slate-500 dark:text-slate-400">
            <tr><th class="pb-3 font-medium">অর্ডার</th><th class="pb-3 font-medium">কাস্টমার</th><th class="pb-3 font-medium">আম</th><th class="pb-3 font-medium">তারিখ</th><th class="pb-3 font-medium">টাকা</th><th class="pb-3 font-medium">স্ট্যাটাস</th></tr>
          </thead>
          <tbody id="orders" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);

// Sidebar
const items = [['📊','ড্যাশবোর্ড'],['🧾','অর্ডার'],['🥭','প্রোডাক্ট'],['👥','কাস্টমার'],['⚙️','সেটিংস']];
$('menu').innerHTML = items.map((m, i) =>
  `<a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 ${i===0 ? 'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}"><span>${m[0]}</span>${m[1]}</a>`).join('');
const toggle = open => { $('sidebar').classList.toggle('-translate-x-full', !open); $('overlay').classList.toggle('hidden', !open); };
$('burger').onclick = () => toggle(true);
$('overlay').onclick = () => toggle(false);

// Dark mode
$('theme').onclick = () => {
  const d = document.documentElement.classList.toggle('dark');
  $('theme').textContent = d ? '☀️' : '🌙';
  try { localStorage.setItem('theme', d ? 'dark' : 'light'); } catch (e) {}
};
if (document.documentElement.classList.contains('dark')) $('theme').textContent = '☀️';

// Stats
const stats = [
  ['💰','আজকের বিক্রি','৳৪৮,৫০০','গতকালের চেয়ে ১২% বেশি','text-green-600'],
  ['📦','মোট অর্ডার','৩৬','গতকালের চেয়ে ৪টি বেশি','text-green-600'],
  ['🧑‍🌾','নতুন কাস্টমার','১২','গত সপ্তাহের চেয়ে ৩ জন কম','text-red-500'],
  ['⏳','পেন্ডিং অর্ডার','৭','আজই পাঠাতে হবে','text-amber-600']
];
$('stats').innerHTML = stats.map(s => `
  <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5">
    <div class="flex items-center justify-between text-sm text-slate-500 dark:text-slate-400"><span>${s[1]}</span><span class="text-xl">${s[0]}</span></div>
    <div class="mt-2 text-2xl sm:text-3xl font-bold">${s[2]}</div>
    <div class="mt-1 text-xs ${s[4]}">${s[3]}</div>
  </div>`).join('');

// Chart (inline SVG)
const days = ['শনি','রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র'];
const vals = [38000, 42500, 36000, 51000, 47500, 57500, 48500];
const bn = n => n.toLocaleString('bn-BD');
const W = 560, H = 220, max = 60000, bw = 44, gap = (W - 7*bw) / 8;
let svg = `<svg viewBox="0 0 ${W} ${H+30}" class="w-full min-w-[420px]" role="img" aria-label="সপ্তাহের বিক্রির বার চার্ট">`;
[0, 20000, 40000, 60000].forEach(v => {
  const y = H - v / max * H;
  svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" class="text-slate-200 dark:text-slate-800"/>`;
});
vals.forEach((v, i) => {
  const h = v / max * H, x = gap + i * (bw + gap), y = H - h;
  svg += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" class="${i===6 ? 'fill-amber-500' : 'fill-amber-300 dark:fill-amber-700'}"/>`;
  svg += `<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" class="fill-slate-500 dark:fill-slate-400">${bn(Math.round(v/1000))}K</text>`;
  svg += `<text x="${x+bw/2}" y="${H+20}" text-anchor="middle" font-size="12" class="fill-slate-600 dark:fill-slate-300">${days[i]}</text>`;
});
$('chart').innerHTML = svg + '</svg>';

// Stock
const stock = [['হিমসাগর',250,300],['ল্যাংড়া',180,300],['ফজলি',120,300],['গোপালভোগ',35,300],['আম্রপালি',22,300],['বারিভোগ',14,300]];
$('stock').innerHTML = stock.map(s => {
  const low = s[1] < 40, pct = Math.round(s[1] / s[2] * 100);
  return `<li><div class="flex justify-between text-sm mb-1"><span>${s[0]}</span><span class="${low ? 'text-red-500 font-semibold' : 'text-slate-500 dark:text-slate-400'}">${bn(s[1])} কেজি${low ? ' · কম!' : ''}</span></div>
  <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800"><div class="h-2 rounded-full ${low ? 'bg-red-500' : 'bg-amber-500'}" style="width:${pct}%"></div></div></li>`;
}).join('');

// Orders
const badge = {
  'পেন্ডিং': 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300',
  'ডেলিভারড': 'bg-green-100 text-green-700 dark:bg-green-500/20 dark:text-green-300',
  'বাতিল': 'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300'
};
const orders = [
  ['#১০৪৮','রহিম উদ্দিন, ঢাকা','হিমসাগর ১০ কেজি','২৭ নভে','১,৮০০','ডেলিভারড'],
  ['#১০৪৭','সুমাইয়া আক্তার, চট্টগ্রাম','ল্যাংড়া ৫ কেজি','২৭ নভে','১,০৫০','পেন্ডিং'],
  ['#১০৪৬','তানভীর হাসান, সিলেট','গোপালভোগ ২০ কেজি','২৬ নভে','৪,২০০','পেন্ডিং'],
  ['#১০৪৫','নুসরাত জাহান, খুলনা','ফজলি ১৫ কেজি','২৬ নভে','২,২৫০','ডেলিভারড'],
  ['#১০৪৪','মাহমুদ আলম, রাজশাহী','আম্রপালি ৫ কেজি','২৫ নভে','১,২৫০','বাতিল'],
  ['#১০৪৩','ফারজানা ইয়াসমিন, ঢাকা','হিমসাগর ২৫ কেজি','২৫ নভে','৪,২৫০','ডেলিভারড']
];
$('orders').innerHTML = orders.map(o => `<tr>
  <td class="py-3 font-medium">${o[0]}</td><td>${o[1]}</td><td>${o[2]}</td><td class="text-slate-500 dark:text-slate-400">${o[3]}</td>
  <td class="font-semibold">৳${o[4]}</td><td><span class="rounded-full px-2.5 py-1 text-xs font-medium ${badge[o[5]]}">${o[5]}</span></td></tr>`).join('');
</script>
</body>
</html>
